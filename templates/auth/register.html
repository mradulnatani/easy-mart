{% extends 'base.html' %}
{% block title %}Register | Easy-Mart{% endblock %}

{% block content %}
<div class="card" style="max-width: 680px; margin: 1.5rem auto;">
    <h1>Create Easy-Mart Account</h1>
    <p class="subtitle">Choose whether you are a Wholesaler (supplying stock) or a Retailer (placing orders).</p>
    <form method="post" style="margin-top: 1rem;">
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <div class="grid grid-2">
            <div class="form-group">
                <label for="role">Account Type</label>
                <select id="role" name="role" required>
                    <option value="RETAILER" {% if form_data.role == 'RETAILER' %}selected{% endif %}>Retailer (Buyer)</option>
                    <option value="WHOLESALER" {% if form_data.role == 'WHOLESALER' %}selected{% endif %}>Wholesaler (Supplier)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="business_name">Shop / Business Name</label>
                <input id="business_name" type="text" name="business_name" value="{{ form_data.business_name|default:'' }}" placeholder="e.g., Sharma Traders">
            </div>
            <div class="form-group">
                <label for="username">Username *</label>
                <input id="username" type="text" name="username" value="{{ form_data.username|default:'' }}" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" value="{{ form_data.email|default:'' }}">
            </div>
            <div class="form-group">
                <label for="phone_number">Phone Number *</label>
                <input id="phone_number" type="text" name="phone_number" value="{{ form_data.phone_number|default:'' }}" required>
            </div>
            <div class="form-group">
                <label for="gst_number">GST / Tax ID (optional)</label>
                <input id="gst_number" type="text" name="gst_number" value="{{ form_data.gst_number|default:'' }}">
            </div>
        </div>

        <div class="form-group">
            <label for="shipping_address">Street / Shop Address *</label>
            <input id="shipping_address" type="text" name="shipping_address" value="{{ form_data.shipping_address|default:'' }}" required>
        </div>

        <div class="grid grid-3">
            <div class="form-group">
                <label for="city">City</label>
                <input id="city" type="text" name="city" value="{{ form_data.city|default:'' }}">
            </div>
            <div class="form-group">
                <label for="state">State</label>
                <input id="state" type="text" name="state" value="{{ form_data.state|default:'' }}">
            </div>
            <div class="form-group">
                <label for="pin_code">PIN Code</label>
                <input id="pin_code" type="text" name="pin_code" value="{{ form_data.pin_code|default:'' }}">
            </div>
        </div>

        <div class="grid grid-2">
            <div class="form-group">
                <label for="password">Password *</label>
                <input id="password" type="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password *</label>
                <input id="confirm_password" type="password" name="confirm_password" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
    </form>
</div>
{% endblock %}
