{% extends 'base.html' %}
{% block title %}Profile | Easy-Mart{% endblock %}

{% block content %}
<div class="card" style="max-width: 680px; margin: 1rem auto;">
    <h1>Account Profile</h1>
    <p class="subtitle">Username: <strong>{{ user.username }}</strong> | Role: <span class="pill pill-blue">{{ user.get_role_display }}</span></p>
    <form method="post" style="margin-top: 1rem;">
        {% csrf_token %}
        <div class="grid grid-2">
            <div class="form-group">
                <label>Business / Shop Name</label>
                <input type="text" name="business_name" value="{{ user.business_name }}">
            </div>
            <div class="form-group">
                <label>GST / Tax ID</label>
                <input type="text" name="gst_number" value="{{ user.gst_number }}">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ user.email }}">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" name="phone_number" value="{{ user.phone_number }}" required>
            </div>
        </div>
        <div class="form-group">
            <label>Address</label>
            <input type="text" name="shipping_address" value="{{ user.shipping_address }}" required>
        </div>
        <div class="grid grid-3">
            <div class="form-group">
                <label>City</label>
                <input type="text" name="city" value="{{ user.city }}">
            </div>
            <div class="form-group">
                <label>State</label>
                <input type="text" name="state" value="{{ user.state }}">
            </div>
            <div class="form-group">
                <label>PIN Code</label>
                <input type="text" name="pin_code" value="{{ user.pin_code }}">
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
</div>
{% endblock %}
