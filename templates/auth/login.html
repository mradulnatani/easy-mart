{% extends 'base.html' %}
{% block title %}Login | Easy-Mart{% endblock %}

{% block content %}
<div class="card" style="max-width: 440px; margin: 2rem auto;">
    <h1>Sign In</h1>
    <p class="subtitle">Authenticated via JWT (HttpOnly cookie + API token support).</p>
    <form method="post" style="margin-top: 1rem;">
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <div class="form-group">
            <label for="username">Username</label>
            <input id="username" type="text" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
    </form>
    <p class="subtitle" style="margin-top: 1rem; text-align: center;">
        New to Easy-Mart? <a href="{% url 'register_page' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Create an account</a>
    </p>
</div>
{% endblock %}
